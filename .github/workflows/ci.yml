name: Cloud Infra CI & Validation

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  validate-terraform:
    name: Validate Terraform IaC
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.8.0

      - name: Check Terraform formatting
        run: terraform fmt -check -recursive
        working-directory: terraform

      - name: Initialize Terraform (no-backend)
        run: terraform init -backend=false
        working-directory: terraform

      - name: Validate Terraform syntax
        run: terraform validate
        working-directory: terraform

  lint-helm:
    name: Lint Helm Charts
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.14.0

      - name: Lint Helm Charts
        run: |
          charts_found=0
          for chart in apps/*/Chart.yaml; do
            if [ -f "$chart" ]; then
              charts_found=1
              chart_dir=$(dirname "$chart")
              echo "Linting chart: $chart_dir"
              helm lint "$chart_dir"
            fi
          done
          if [ $charts_found -eq 0 ]; then
            echo "No Helm charts found in apps/ - skipping lint."
          fi

  validate-k8s-manifests:
    name: Validate Kubernetes YAMLs
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Validate YAML syntax
        run: |
          python -c "
          import os, glob, yaml

          yaml_files = glob.glob('apps/**/*.yaml', recursive=True) + glob.glob('cluster/**/*.yaml', recursive=True)
          errors = []
          for f in yaml_files:
              # Bỏ qua các file Go template của Helm vì chứa cú pháp {{ }}
              if 'templates' in f:
                  continue
              try:
                  with open(f, 'r', encoding='utf-8') as fp:
                      list(yaml.safe_load_all(fp))
                  print(f'✅ {f}: Valid YAML')
              except Exception as e:
                  errors.append(f'{f}: {e}')
                  print(f'❌ {f}: {e}')

          if errors:
              print(f'\nFound {len(errors)} YAML errors.')
              exit(1)
          print('\nAll non-template Kubernetes manifests are valid!')
          "
