# ==============================================================================
# Loki Helm Values (Optimized for Single-Node K3s ARM64 - Oracle Cloud VPS)
# Architecture: SingleBinary (Monolithic), Local Disk (Filesystem), 5-Day Retention
# ==============================================================================

deploymentMode: SingleBinary

loki:
  auth_enabled: false
  commonConfig:
    replication_factor: 1
  storage:
    type: filesystem
  schemaConfig:
    configs:
      - from: 2024-01-01
        store: tsdb
        object_store: filesystem
        schema: v13
        index:
          prefix: index_
          period: 24h
  compactor:
    working_directory: /var/loki/compactor
    compaction_interval: 10m
    retention_enabled: true
    retention_delete_delay: 2h
    retention_delete_worker_count: 50
    delete_request_store: filesystem
  limits_config:
    retention_period: 120h # 5 days strict retention
    max_query_length: 120h
    reject_old_samples: true
    reject_old_samples_max_age: 120h
    ingestion_rate_mb: 4
    ingestion_burst_size_mb: 6

singleBinary:
  replicas: 1
  persistence:
    enabled: true
    size: 6Gi
  resources:
    limits:
      cpu: 300m
      memory: 512Mi
    requests:
      cpu: 50m
      memory: 256Mi

# Disable multi-node scalable components
read:
  replicas: 0
write:
  replicas: 0
backend:
  replicas: 0

# Disable cache daemons & canaries to save RAM
chunksCache:
  enabled: false
resultsCache:
  enabled: false
lokiCanary:
  enabled: false
test:
  enabled: false

# Gateway (Nginx reverse proxy for Loki)
gateway:
  enabled: true
  replicas: 1
  resources:
    limits:
      cpu: 100m
      memory: 64Mi
    requests:
      cpu: 10m
      memory: 32Mi
