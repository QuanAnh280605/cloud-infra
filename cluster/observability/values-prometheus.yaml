# ==============================================================================
# Prometheus Helm Values (Optimized for Single-Node K3s ARM64 - Oracle Cloud VPS)
# Architecture: Single Server, Node Exporter, 15-Day Retention, PVC 6GB
# ==============================================================================

server:
  enabled: true
  retention: 15d
  global:
    scrape_interval: 30s
    scrape_timeout: 10s
    evaluation_interval: 30s

  persistentVolume:
    enabled: true
    accessModes:
      - ReadWriteOnce
    size: 6Gi

  resources:
    limits:
      cpu: 300m
      memory: 800Mi
    requests:
      cpu: 50m
      memory: 256Mi

# Collect host metrics (CPU, RAM, Disk, Load)
nodeExporter:
  enabled: true
  resources:
    limits:
      cpu: 50m
      memory: 64Mi
    requests:
      cpu: 10m
      memory: 16Mi

# Collect K8s objects (Pods, Deployments, Namespaces)
kubeStateMetrics:
  enabled: true
  resources:
    limits:
      cpu: 100m
      memory: 128Mi
    requests:
      cpu: 10m
      memory: 32Mi

# Disable heavy / unused components to save RAM
alertmanager:
  enabled: false

prometheus-pushgateway:
  enabled: false
