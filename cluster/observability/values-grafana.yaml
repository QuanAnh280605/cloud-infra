# ==============================================================================
# Grafana Helm Values (Optimized for Single-Node K3s ARM64 - Oracle Cloud VPS)
# Architecture: Standalone, SQLite on PVC 2GB, Auto-configured Correlated Datasources
# ==============================================================================

adminPassword: admin

resources:
  limits:
    cpu: 200m
    memory: 256Mi
  requests:
    cpu: 20m
    memory: 64Mi

persistence:
  enabled: true
  accessModes:
    - ReadWriteOnce
  size: 2Gi

ingress:
  enabled: true
  ingressClassName: traefik
  hosts:
    - grafana.140.245.58.162.nip.io
  path: /
  pathType: Prefix

# Pre-configure Correlated Datasources (Loki <-> Tempo <-> Prometheus)
datasources:
  datasources.yaml:
    apiVersion: 1
    datasources:
      - name: Prometheus
        type: prometheus
        uid: prometheus
        url: http://prometheus-server.monitoring.svc.cluster.local
        access: proxy
        isDefault: true
        jsonData:
          httpMethod: POST
          timeInterval: 30s

      - name: Loki
        type: loki
        uid: loki
        url: http://loki-gateway.monitoring.svc.cluster.local
        access: proxy
        jsonData:
          maxLines: 1000
          derivedFields:
            - name: TraceID
              matcherRegex: "(?:trace_id|traceId|traceID)[:=]\\s*\"?([a-fA-F0-9]{32})\"?"
              url: "$${__value.raw}"
              datasourceUid: tempo

      - name: Tempo
        type: tempo
        uid: tempo
        url: http://tempo.monitoring.svc.cluster.local:3100
        access: proxy
        jsonData:
          tracesToLogsV2:
            datasourceUid: loki
            filterByTraceID: true
            spanStartTimeShift: "-5m"
            spanEndTimeShift: "5m"
            tags:
              - key: service.name
                value: app
          serviceMap:
            datasourceUid: prometheus

dashboardProviders:
  dashboardproviders.yaml:
    apiVersion: 1
    providers:
      - name: "default"
        orgId: 1
        folder: ""
        type: file
        disableDeletion: false
        editable: true
        options:
          path: /var/lib/grafana/dashboards/default
