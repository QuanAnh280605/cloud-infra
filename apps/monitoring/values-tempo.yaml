# ==============================================================================
# Cấu hình Grafana Tempo (Distributed Tracing gọn nhẹ)
# Namespace: monitoring
# ==============================================================================

tempo:
  # Tempo chạy all-in-one (ingester + querier + compactor + metrics-generator) nên
  # cần nhiều RAM hơn chart mặc định: limit 384Mi từng bị OOMKilled liên tục
  # (48 lần restart), khiến trace mới không hiển thị được.
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 1
      memory: 1Gi

  retention: 72h    # Lưu vết trong 3 ngày

  storage:
    trace:
      backend: local
      local:
        path: /var/tempo/traces
      wal:
        path: /var/tempo/wal

  persistence:
    enabled: true
    storageClassName: local-path
    size: 3Gi

  receivers:
    otlp:
      protocols:
        http:
          endpoint: "0.0.0.0:4318"
        grpc:
          endpoint: "0.0.0.0:4317"
    jaeger:
      protocols:
        thrift_http:
          endpoint: "0.0.0.0:14268"
        grpc:
          endpoint: "0.0.0.0:14250"
    zipkin:
      endpoint: "0.0.0.0:9411"

