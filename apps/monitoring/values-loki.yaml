# ==============================================================================
# Cấu hình Loki & Promtail (Log tập trung, siêu nhẹ)
# Namespace: monitoring
# ==============================================================================

loki:
  enabled: true
  isDefault: false

  # Pin cứng để config bên dưới luôn khớp version (đổi image phải đổi schema).
  image:
    repository: grafana/loki
    tag: 2.6.1
    pullPolicy: IfNotPresent

  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi

  persistence:
    enabled: true
    storageClassName: local-path
    size: 5Gi

  # Chart loki-stack 2.10.2 chạy image grafana/loki:2.6.1 — image này chỉ hỗ trợ
  # schema tối đa v11 + store boltdb-shipper (tsdb/v12/v13 chỉ có từ Loki 2.7+).
  config:
    auth_enabled: false
    server:
      http_listen_port: 3100
      grpc_listen_port: 9096
      log_level: info

    ingester:
      lifecycler:
        address: 127.0.0.1
        ring:
          kvstore:
            store: inmemory
          replication_factor: 1
        final_sleep: 0s
      chunk_idle_period: 5m
      chunk_retain_period: 30s
      wal:
        enabled: true
        dir: /data/loki/wal

    schema_config:
      configs:
        - from: 2024-01-01
          store: boltdb-shipper
          object_store: filesystem
          schema: v11
          index:
            prefix: index_
            period: 24h

    storage_config:
      boltdb_shipper:
        active_index_directory: /data/loki/index
        cache_location: /data/loki/index_cache
        shared_store: filesystem
      filesystem:
        directory: /data/loki/chunks

    limits_config:
      enforce_metric_name: false
      reject_old_samples: true
      reject_old_samples_max_age: 168h
      retention_period: 168h       # Lưu giữ log trong 7 ngày

    # Loki 2.6 xoá dữ liệu hết hạn bằng compactor (table_manager không còn dùng)
    compactor:
      working_directory: /data/loki/compactor
      shared_store: filesystem
      retention_enabled: true
      retention_delete_delay: 2h
      retention_delete_worker_count: 150

# ------------------------------------------------------------------------------
# Promtail DaemonSet (Tự động thu thập log từ tất cả các Container)
# ------------------------------------------------------------------------------
promtail:
  enabled: true

  resources:
    requests:
      cpu: 50m
      memory: 48Mi
    limits:
      cpu: 200m
      memory: 96Mi

  config:
    lokiAddress: http://{{ .Release.Name }}:3100/loki/api/v1/push
    snippets:
      extraScrapeConfigs: ""
      pipelineStages:
        - cri: {}
        - json:
            expressions:
              level: level
              request_id: request_id
              trace_id: trace_id
              path: path
              status: status_code
        - labels:
            level: ""
            path: ""
            status: ""

