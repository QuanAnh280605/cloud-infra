# ==============================================================================
# Cấu hình Loki & Promtail (Log tập trung, siêu nhẹ)
# Namespace: monitoring
# ==============================================================================

loki:
  enabled: true
  isDefault: false

  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi

  persistence:
    enabled: true
    storageClassName: local-path
    size: 5Gi

  config:
    auth_enabled: false
    server:
      http_listen_port: 3100
      grpc_listen_port: 9096

    common:
      path_prefix: /var/loki
      storage:
        filesystem:
          chunks_directory: /var/loki/chunks
          rules_directory: /var/loki/rules
      replication_factor: 1
      ring:
        instance_addr: 127.0.0.1
        kvstore:
          store: inmemory

    schema_config:
      configs:
        - from: 2024-01-01
          store: tsdb
          object_store: filesystem
          schema: v13
          index:
            prefix: index_
            period: 24h

    limits_config:
      enforce_metric_name: false
      reject_old_samples: true
      reject_old_samples_max_age: 168h
      retention_period: 168h       # Lưu giữ log trong 7 ngày

    table_manager:
      retention_deletes_enabled: true
      retention_period: 168h

# ------------------------------------------------------------------------------
# Promtail DaemonSet (Tự động thu thập log từ tất cả các Container)
# ------------------------------------------------------------------------------
promtail:
  enabled: true

  resources:
    requests:
      cpu: 50m
      memory: 48Mi
    limits:
      cpu: 200m
      memory: 96Mi

  config:
    lokiAddress: http://{{ .Release.Name }}:3100/loki/api/v1/push
    snippets:
      extraScrapeConfigs: ""
      pipelineStages:
        - cri: {}
        - json:
            expressions:
              level: level
              request_id: request_id
              trace_id: trace_id
              path: path
              status: status_code
        - labels:
            level: ""
            path: ""
            status: ""

