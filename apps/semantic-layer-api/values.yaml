# Giá trị thực dùng khi Argo CD render chart API; image.tag do CI cập nhật.
replicaCount: 1

image:
  repository: ghcr.io/thanqpham/ai-semantic-layer-backend
  pullPolicy: Always
  tag: "c30d81b"

# API dùng ServiceAccount riêng; token được mount theo cấu hình hiện tại.
serviceAccount:
  create: true
  automount: true

service:
  type: ClusterIP
  port: 8000

# Traefik định tuyến host API; cert-manager cấp TLS qua ClusterIssuer.
ingress:
  enabled: true
  className: traefik
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
  hosts:
    - host: api.140.245.58.162.nip.io
      paths:
        - path: /
          pathType: Prefix
  tls:
    - secretName: backend-tls-secret
      hosts:
        - api.140.245.58.162.nip.io

resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    cpu: 1000m
    memory: 1024Mi

# Readiness kiểm tra trước khi nhận request; liveness khởi động lại container lỗi.
livenessProbe:
  httpGet:
    path: /health
    port: http
  initialDelaySeconds: 20
  periodSeconds: 10
readinessProbe:
  httpGet:
    path: /health
    port: http
  initialDelaySeconds: 15
  periodSeconds: 5

env:
  appEnv: production
  frontendAppUrl: https://app.140.245.58.162.nip.io
  corsOrigins: https://app.140.245.58.162.nip.io,http://localhost:3000
  # Khóa Langfuse lấy từ OCI Vault qua ExternalSecret.
  langfuse:
    enabled: true
    baseUrl: https://jp.cloud.langfuse.com

# API xuất distributed traces qua OTLP/HTTP tới Tempo trong namespace monitoring.
tracing:
  enabled: true
  endpoint: http://monitoring-tempo.monitoring.svc.cluster.local:4318
  samplerRatio: "1.0"
  excludePaths: /health,/metrics,/docs,/openapi.json,/redoc

# PostgreSQL một replica dùng PVC local-path; PVC không thay thế sao lưu.
postgres:
  enabled: true
  dbName: semantic_layer
  user: semantic_user
  storage: 15Gi

# ServiceMonitor chỉ được tạo khi API bật endpoint metrics.
metrics:
  enabled: true
