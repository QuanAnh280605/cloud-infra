# API Deployment lấy image, tài nguyên và probe từ values.yaml; Secret được nạp lúc Pod khởi động.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "semantic-layer-api.fullname" . }}
  labels:
    {{- include "semantic-layer-api.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "semantic-layer-api.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      annotations:
        # Đổi template ExternalSecret hoặc cấu hình tracing sẽ tạo Pod mới để nhận cấu hình.
        checksum/config: {{ include (print $.Template.BasePath "/external-secret.yaml") . | sha256sum }}
        {{- if .Values.tracing.enabled }}
        checksum/otel: {{ include (print $.Template.BasePath "/otel-bootstrap.yaml") . | sha256sum }}
        {{- end }}
        # Annotation này chỉ tự khởi động lại Pod nếu cụm đã cài Stakater Reloader.
        reloader.stakater.com/auto: "true"
      labels:
        {{- include "semantic-layer-api.labels" . | nindent 8 }}
    spec:
      serviceAccountName: {{ include "semantic-layer-api.serviceAccountName" . }}
      containers:
        - name: {{ .Chart.Name }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.service.port }}
              protocol: TCP
          envFrom:
            - secretRef:
                name: backend-secret
          {{- if .Values.tracing.enabled }}
          env:
            - name: PYTHONPATH
              value: "/otel-bootstrap"
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: {{ .Values.tracing.endpoint | quote }}
            - name: OTEL_EXPORTER_OTLP_PROTOCOL
              value: "http/protobuf"
            - name: OTEL_SERVICE_NAME
              value: {{ include "semantic-layer-api.fullname" . | quote }}
            - name: OTEL_RESOURCE_ATTRIBUTES
              value: "deployment.environment={{ .Values.env.appEnv }},service.namespace={{ .Release.Namespace }}"
            - name: OTEL_TRACES_SAMPLER_ARG
              value: {{ .Values.tracing.samplerRatio | quote }}
            - name: FASTAPI_OTEL_EXCLUDE_PATHS
              value: {{ .Values.tracing.excludePaths | quote }}
            - name: OTEL_BSP_SCHEDULE_DELAY
              value: "2000"
          {{- end }}
          {{- with .Values.livenessProbe }}
          livenessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.readinessProbe }}
          readinessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- if .Values.tracing.enabled }}
          volumeMounts:
            - name: otel-bootstrap
              mountPath: /otel-bootstrap
              readOnly: true
          {{- end }}
      {{- if .Values.tracing.enabled }}
      volumes:
        - name: otel-bootstrap
          configMap:
            name: {{ include "semantic-layer-api.fullname" . }}-otel
      {{- end }}
