apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "semantic-layer-api.fullname" . }}
  labels:
    {{- include "semantic-layer-api.labels" . | nindent 4 }}
spec:
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "semantic-layer-api.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/external-secret.yaml") . | sha256sum }}
        reloader.stakater.com/auto: "true"
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      labels:
        {{- include "semantic-layer-api.labels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "semantic-layer-api.serviceAccountName" . }}
      {{- with .Values.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- if .Values.tracing.enabled }}
      initContainers:
        # Installs the FastAPI instrumentation next to the app (the image already
        # ships the OpenTelemetry SDK) and drops the sitecustomize bootstrap.
        - name: otel-instrumentation
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command:
            - /bin/sh
            - -c
            - |
              pip install --no-cache-dir --disable-pip-version-check --no-deps --target=/otel \
                "opentelemetry-instrumentation-fastapi=={{ .Values.tracing.instrumentationVersion }}" \
                "opentelemetry-instrumentation-asgi=={{ .Values.tracing.instrumentationVersion }}" \
                "opentelemetry-util-http=={{ .Values.tracing.instrumentationVersion }}" \
                "wrapt" \
                || pip install --no-cache-dir --disable-pip-version-check --target=/otel \
                "opentelemetry-instrumentation-fastapi=={{ .Values.tracing.instrumentationVersion }}" \
                || echo "WARN: OpenTelemetry instrumentation install failed; tracing stays disabled"
              cp /otel-bootstrap/sitecustomize.py /otel/sitecustomize.py
          volumeMounts:
            - name: otel-instrumentation
              mountPath: /otel
            - name: otel-bootstrap
              mountPath: /otel-bootstrap
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
      {{- end }}
      containers:
        - name: {{ .Chart.Name }}
          {{- with .Values.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.service.port }}
              protocol: TCP
          envFrom:
            - secretRef:
                name: backend-secret
          {{- if .Values.tracing.enabled }}
          env:
            - name: PYTHONPATH
              value: "/otel"
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: {{ .Values.tracing.endpoint | quote }}
            - name: OTEL_EXPORTER_OTLP_PROTOCOL
              value: "http/protobuf"
            - name: OTEL_SERVICE_NAME
              value: {{ include "semantic-layer-api.fullname" . | quote }}
            - name: OTEL_RESOURCE_ATTRIBUTES
              value: "deployment.environment={{ .Values.env.appEnv }},service.namespace={{ .Release.Namespace }}"
            - name: OTEL_TRACES_SAMPLER
              value: "parentbased_traceidratio"
            - name: OTEL_TRACES_SAMPLER_ARG
              value: {{ .Values.tracing.samplerRatio | quote }}
            - name: OTEL_PYTHON_FASTAPI_EXCLUDED_URLS
              value: "health,metrics,docs,openapi.json"
            - name: OTEL_BSP_SCHEDULE_DELAY
              value: "2000"
          {{- end }}
          {{- with .Values.livenessProbe }}
          livenessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.readinessProbe }}
          readinessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- if or .Values.tracing.enabled .Values.volumeMounts }}
          volumeMounts:
            {{- if .Values.tracing.enabled }}
            - name: otel-instrumentation
              mountPath: /otel
            {{- end }}
            {{- with .Values.volumeMounts }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          {{- end }}
      volumes:
        {{- if .Values.tracing.enabled }}
        - name: otel-instrumentation
          emptyDir: {}
        - name: otel-bootstrap
          configMap:
            name: {{ include "semantic-layer-api.fullname" . }}-otel
        {{- end }}
        {{- with .Values.volumes }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
