{{- if .Values.tracing.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "semantic-layer-api.fullname" . }}-otel
  labels:
    {{- include "semantic-layer-api.labels" . | nindent 4 }}
data:
  sitecustomize.py: |
    """OpenTelemetry bootstrap for the semantic-layer API.

    FastAPI (>= 0.162) instruments itself natively: it emits HTTP server spans and
    dependency/endpoint/serialization spans through the global tracer provider. The
    application image already ships the OpenTelemetry SDK and the OTLP/HTTP
    exporter, so this module only has to:

    1. install a tracer provider that exports spans to Tempo;
    2. tell FastAPI which paths (probes, metrics, docs) must not be traced.

    CPython imports "sitecustomize" at interpreter start-up, before the app is
    imported, so the FastAPI hook is in place before `FastAPI(...)` runs.
    Everything is defensive: tracing must never be able to break the app.
    """

    import os

    _EXCLUDED_ENV = "FASTAPI_OTEL_EXCLUDE_PATHS"


    def _excluded_paths():
        raw = os.environ.get(_EXCLUDED_ENV, "")
        return [part.strip() for part in raw.split(",") if part.strip()]


    def _install_tracer_provider():
        from opentelemetry import trace
        from opentelemetry.exporter.otlp.proto.http.trace_exporter import OTLPSpanExporter
        from opentelemetry.sdk.trace import TracerProvider
        from opentelemetry.sdk.trace.export import BatchSpanProcessor
        from opentelemetry.sdk.trace.sampling import ParentBased, TraceIdRatioBased

        try:
            ratio = float(os.environ.get("OTEL_TRACES_SAMPLER_ARG", "1.0"))
        except ValueError:
            ratio = 1.0

        provider = TracerProvider(sampler=ParentBased(TraceIdRatioBased(ratio)))
        provider.add_span_processor(BatchSpanProcessor(OTLPSpanExporter()))
        trace.set_tracer_provider(provider)


    def _install_fastapi_exclusions(paths):
        import fastapi

        original_init = fastapi.FastAPI.__init__

        def _matches(scope):
            path = scope.get("path") or ""
            for candidate in paths:
                if path == candidate or path.startswith(candidate.rstrip("/") + "/"):
                    return True
            return False

        def _fastapi_init(self, *args, **kwargs):
            telemetry = dict(kwargs.get("telemetry") or {})
            telemetry.setdefault("exclude", _matches)
            kwargs["telemetry"] = telemetry
            original_init(self, *args, **kwargs)

        fastapi.FastAPI.__init__ = _fastapi_init


    if os.environ.get("OTEL_EXPORTER_OTLP_ENDPOINT"):
        try:
            _install_tracer_provider()
        except Exception:  # noqa: BLE001 - tracing must never break the app
            pass

    if _excluded_paths():
        try:
            _install_fastapi_exclusions(_excluded_paths())
        except Exception:  # noqa: BLE001 - tracing must never break the app
            pass
{{- end }}
