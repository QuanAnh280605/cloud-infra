apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: backend-external-secret
  namespace: semantic-layer
spec:
  refreshInterval: "1m" # Tự động kiểm tra cập nhật lại mỗi 1 giờ
  secretStoreRef:
    name: oci-vault-store
    kind: SecretStore
  target:
    name: backend-secret # Tên Kubernetes Secret sinh ra trong RAM cụm
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        APP_ENV: {{ .Values.env.appEnv | quote }}
        PORT: {{ .Values.service.port | quote }}
        CORS_ORIGINS: "https://app.140.245.58.162.nip.io"
        DATABASE_URL: "postgresql+asyncpg://{{ .Values.postgres.user }}:{{ "{{" }} .dbPassword {{ "}}" }}@postgres-service:5432/{{ .Values.postgres.dbName }}"
        ENCRYPTION_KEY: "{{ "{{" }} .encryptionKey {{ "}}" }}"
        SECRET_KEY: "{{ "{{" }} .secretKey {{ "}}" }}"
        OPENAI_API_KEY: "{{ "{{" }} .openaiApiKey {{ "}}" }}"
  data:
    - secretKey: dbPassword
      remoteRef:
        key: backendpassword
    - secretKey: encryptionKey
      remoteRef:
        key: backend-encryption-key
    - secretKey: secretKey
      remoteRef:
        key: backend-secret-key
    - secretKey: openaiApiKey
      remoteRef:
        key: backend-openai-api-key