apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: backend-external-secret
  namespace: semantic-layer
spec:
  refreshInterval: "1m" # Tự động quét và cập nhật lại từ OCI Vault mỗi 1 phút
  secretStoreRef:
    name: oci-vault-store
    kind: SecretStore
  target:
    name: backend-secret # Tên Kubernetes Secret sinh ra trong RAM cụm
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        APP_ENV: {{ .Values.env.appEnv | quote }}
        PORT: {{ .Values.service.port | quote }}
        CORS_ORIGINS: {{ .Values.env.corsOrigins | default "https://app.140.245.58.162.nip.io,http://localhost:3000" | quote }}
        FRONTEND_APP_URL: {{ .Values.env.frontendAppUrl | default "https://app.140.245.58.162.nip.io" | quote }}
        DATABASE_URL: "postgresql+asyncpg://{{ .Values.postgres.user }}:{{ "{{" }} .dbPassword {{ "}}" }}@postgres-service:5432/{{ .Values.postgres.dbName }}"
        ENCRYPTION_KEY: "{{ "{{" }} .encryptionKey {{ "}}" }}"
        SECRET_KEY: "{{ "{{" }} .secretKey {{ "}}" }}"
        OPENAI_API_KEY: "{{ "{{" }} .openaiApiKey {{ "}}" }}"
        LLM_API_KEY: "{{ "{{" }} .openaiApiKey {{ "}}" }}"
        LLM_PROVIDER: "{{ "{{" }} .llmProvider | default \"openai\" {{ "}}" }}"
        MODEL_NAME: "{{ "{{" }} .modelName | default \"gpt-4o-mini\" {{ "}}" }}"
        # AI Observability (Langfuse & LangSmith - Pulled from OCI Vault)
        {{- if .Values.env.langfuse.enabled }}
        LANGFUSE_TRACING_ENABLED: "true"
        LANGFUSE_PUBLIC_KEY: "{{ "{{" }} .langfusePublicKey {{ "}}" }}"
        LANGFUSE_SECRET_KEY: "{{ "{{" }} .langfuseSecretKey {{ "}}" }}"
        LANGFUSE_BASE_URL: {{ .Values.env.langfuse.baseUrl | default "https://cloud.langfuse.com" | quote }}
        {{- end }}
        {{- if .Values.env.langchain.enabled }}
        LANGCHAIN_TRACING_V2: "true"
        LANGCHAIN_PROJECT: {{ .Values.env.langchain.project | default "ai-semantic-layer-prod" | quote }}
        LANGCHAIN_API_KEY: "{{ "{{" }} .langchainApiKey {{ "}}" }}"
        {{- end }}
  data:
    - secretKey: dbPassword
      remoteRef:
        key: backendpassword
    - secretKey: encryptionKey
      remoteRef:
        key: backend-encryption-key
    - secretKey: secretKey
      remoteRef:
        key: backend-secret-key
    - secretKey: openaiApiKey
      remoteRef:
        key: backend-openai-api-key
    - secretKey: llmProvider
      remoteRef:
        key: backend-llm-provider
    - secretKey: modelName
      remoteRef:
        key: backend-model-name
    {{- if .Values.env.langfuse.enabled }}
    - secretKey: langfusePublicKey
      remoteRef:
        key: backend-langfuse-public-key
    - secretKey: langfuseSecretKey
      remoteRef:
        key: backend-langfuse-secret-key
    {{- end }}
    {{- if .Values.env.langchain.enabled }}
    - secretKey: langchainApiKey
      remoteRef:
        key: backend-langchain-api-key
    {{- end }}
