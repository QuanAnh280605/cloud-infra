apiVersion: v1
kind: Secret
metadata:
  name: backend-secret
type: Opaque
stringData:
  APP_ENV: {{ .Values.env.appEnv | quote }}
  PORT: {{ .Values.service.port | quote }}
  DATABASE_URL: "postgresql+asyncpg://{{ .Values.postgres.user }}:{{ .Values.postgres.password }}@postgres-service:5432/{{ .Values.postgres.dbName }}"
  ENCRYPTION_KEY: {{ .Values.env.encryptionKey | quote }}
  SECRET_KEY: {{ .Values.env.secretKey | quote }}