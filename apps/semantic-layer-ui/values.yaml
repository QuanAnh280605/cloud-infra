# Giá trị thực dùng khi Argo CD render chart UI; image.tag do CI cập nhật.
replicaCount: 1

image:
  repository: ghcr.io/thanqpham/ai-semantic-layer-frontend
  pullPolicy: Always
  tag: "919297f"

serviceAccount:
  create: true
  automount: true

service:
  type: ClusterIP
  port: 8080

# Traefik định tuyến host giao diện; cert-manager cấp TLS qua ClusterIssuer.
ingress:
  enabled: true
  className: traefik
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
  hosts:
    - host: app.140.245.58.162.nip.io
      paths:
        - path: /
          pathType: Prefix
  tls:
    - secretName: frontend-tls-secret
      hosts:
        - app.140.245.58.162.nip.io

# Cụm hiện dùng Ingress thay vì Gateway API HTTPRoute.
httpRoute:
  enabled: false

resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    cpu: 1000m
    memory: 1024Mi

# Readiness kiểm tra trước khi nhận request; liveness khởi động lại container lỗi.
livenessProbe:
  httpGet:
    path: /
    port: http
  initialDelaySeconds: 20
  periodSeconds: 10
readinessProbe:
  httpGet:
    path: /
    port: http
  initialDelaySeconds: 15
  periodSeconds: 5

# Cụm một node đang chạy một Pod UI; HPA hiện tắt.
autoscaling:
  enabled: false
