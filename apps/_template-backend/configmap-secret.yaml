apiVersion: v1
kind: ConfigMap
metadata:
  name: my-backend-config
  namespace: my-app
data:
  APP_ENV: "production"
  PORT: "8000"
---
apiVersion: v1
kind: Secret
metadata:
  name: my-backend-secret
  namespace: my-app
type: Opaque
stringData:
  DATABASE_URL: "postgresql://user:pass@host:5432/dbname"
  SECRET_KEY: "change-me-to-a-secure-random-string"
